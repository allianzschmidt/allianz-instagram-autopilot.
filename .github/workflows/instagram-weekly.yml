name: Allianz Instagram – echte Premium-Wochenanalyse
on:
  push:
    paths:
      - '.github/workflows/instagram-weekly.yml'
      - 'scripts/premium_analytics.py'
  schedule:
    - cron: '00 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Echte Premium-Veröffentlichungen, Reichweite und Buffer-Termine analysieren
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/premium_analytics.py
