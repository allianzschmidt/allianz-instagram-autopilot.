name: Abgelehnte Standardgrafiken sofort aus Buffer entfernen
on:
  push:
    paths:
      - '.github/workflows/hold-rejected-nov18-designs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schmidt-premium-publishing
  cancel-in-progress: false
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nur die vier abgelehnten Standard-Medien in Buffer als Entwurf speichern
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/hold_rejected_nov18_designs.py
