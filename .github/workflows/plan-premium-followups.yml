name: Geprüfte Premium-Beiträge und Stories fest einplanen
on:
  push:
    paths:
      - '.github/workflows/plan-premium-followups.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: premium-instagram-followups
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bildprüfungsbibliothek installieren
        run: python3 -m pip install --user Pillow
