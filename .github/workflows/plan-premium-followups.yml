~Fk73g__&Key-Pair-Id=KX9I6OACHF5M3"]
          digests=["63ec43808bcf57b0f2c667c8ab7fe7ad1d697cebdf13ba209fbb57476092d600","3ec91469f82a18d9e36fb8319806d4ee2fb5354e69798be0716af73f1091edfc","a0a3b13f9f6fa8f8166c65c9dd05c40deb8b88760f7307feb9e5e66fa1a8f99c","1bdb790f6a1db0ca39e9f9330df54ebf6e1fa6825ff700760e4f4115f7fada40"]
          dims=[(1122,1402),(1122,1402),(941,1672),(941,1672)]
          root=Path("assets/approved_followups_nov");root.mkdir(parents=True,exist_ok=True)
          for name,url,digest,dim in zip(names,urls,digests,dims):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Schmidt-Approved-Media/1.0"}),timeout=60) as resp:
                  raw=resp.read()
              if sha256(raw).hexdigest()!=digest:raise RuntimeError("Bilddatei stimmt nicht mit dem Original überein: "+name)
              img=Image.open(io.BytesIO(raw))
              if img.size!=dim or img.format!="PNG":raise RuntimeError("Medienformat stimmt nicht: "+name)
              (root/name).write_bytes(raw)
              print("ORIGINAL PRUEFSUMME BESTAETIGT:",name,len(raw))
          PY
      - name: Freigegebene Bilddateien dauerhaft speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved_followups_nov/
          if ! git diff --cached --quiet; then
            git commit -m "Store four exact verified approved premium social assets"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Nur bestätigte Premium-Inhalte an Buffer übergeben
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CONFIRMED_MEDIA_RELEASE: premium-previously-approved-nov-2026
        run: python3 scripts/schedule_approved_followups_nov.py
