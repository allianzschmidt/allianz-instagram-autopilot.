      - name: Medien auf GitHub hosten ohne andere Designs freizuschalten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved_specific/schueler_bu_2026_11_21/
          if ! git diff --cached --quiet; then
            git commit -m "Upload five manually inspected student BU premium carousel originals"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: User-requested fünfteiligen Schüler-BU-Post sofort bei Buffer veröffentlichen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          USER_RELEASE: user-requested-schueler-bu-premium-feed-2026-11-21
        run: python3 scripts/publish_schueler_bu_premium_once.py
