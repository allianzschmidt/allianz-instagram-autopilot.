name: Einmalige Veröffentlichung – Altersvorsorgedepot 2027 (5 Slides)
on:
  push:
    paths:
      - '.github/workflows/publish-approved-depot-once.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-depot2027-publish-once
  cancel-in-progress: false
jobs:
  approved-depot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aktueller Repository-Stand
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Pillow für Bildprüfung bereitstellen
        run: python3 -m pip install --user Pillow
      - name: Ausschließlich fünf ausdrücklich freigegebene Originalbilder übertragen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import io
          import urllib.request
          sources=["https://m.invideo.io/uploads/579e3c27-8c5e-469e-912c-1de1827d9c06/579e3c27-8c5e-469e-912c-1de1827d9c06?Expires=1794338889&Signature=SxZmvgiRe9ocNvfURssC-I4Pqhs~0YNjBhQ5LeLTYH37gaWX5EiyCjE7M-6EJE8buwOVGIIyz8Bx~cjRbiEGahv0NhPW4HgTO8gIl8LDiJigEoiF38VfMTc-mjwRGi6fKRFcoY255QIEbgfNBCa4WN74NouxzbUp96nMll6V4Wgh~iZpA-S-ofl0SMoUVnC4cj7Y5zcYaAWi2w0IXhtGFN~XuaeuvCxxxbzRIKmT0lkIxIwYIWihnSuoWQBfXXNsVwsr8VK2yMJoPYFBxboiHSiBFRANxMpQTQCKJK8nIcvv-w1S0QFAh-yNSuRlB1Uc-uwMNrnCYMA5xynDVJ2XEA__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/e20b8f86-2ec6-450b-ac4c-bafb53d88a3d/e20b8f86-2ec6-450b-ac4c-bafb53d88a3d?Expires=1794338889&Signature=P6qSL1RfDEckg2T2AmolA7UP3JZ9vd-DUrNVRMXU1IAkAL2GU7jIKODMt7d~sC4M3t45o3~C9A3Jbs6XeAArb5nJlG~hMAugFMYeoqwf-de9lPRabIhLPCayAGMvulvCI5z9GDhP~A5xoU0CZ8eCdb9riL~zcSXESoDby9k4fu6lX004BHEl5Jyo1udKMxU-puSgZ1Yfpa3zvN7JP0y1eCm0M8iQKSMyQTubrPgO7OYKcHdFdorzi-eXtNXKreERFs-2xjmIzE6EgZALdahNSa28PpPea1~QvTd8Qex3ArgOGTIGDBhcU0JQfQnRnFo0Bh--PO1vZC~UUM7FyL7K~w__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/ec97b6ed-e28c-4125-bd43-ad7145d98a2b/ec97b6ed-e28c-4125-bd43-ad7145d98a2b?Expires=1794338889&Signature=GHpXZkEbGwokIxLdaXLrpc7Jc9mKP8vyNk9EXpgG46xUerEBEuzr1pU57GTDozlimVHTu-bv7YUQY9cZV6CrAYp3fV~DwQHH33j4-AHoccxmKB79v2KFprKA~AX28vUiDQ1Mb32rbY4op6cEIudPRWskygEY7tKzURQhsNOAup-LdRi8zVqLvVir04BkZXSRLRABI5o9qo11DQgcUBWIYYRFj7RnVMIBLpqO3brI1yzzJgAhtEiTS7iU9xJnNIT0gk5JzlygXhjCBp8UG9fy62qLNEbHeCmLc9S~dqpYtWHhkIki~b3Iu9wgyYrQVpiSEVCT26JvoOOo5jQ7omcciQ__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/a46d483c-fb67-4541-bbd3-2e977df01021/a46d483c-fb67-4541-bbd3-2e977df01021?Expires=1794338899&Signature=VToYPu5i8Ry6vRsOn48oA2F1P80rhjFetshObCJ7yu9PMtUpPkVBssZVPbzlWANwWdmYJWk~FeAVCep4eQv-EQ9Lm8zaLTeuAl1UDcuSxdz1mFZ2dtrZXw7eVREZF3kCVqKoAXt30CQQ0mNyOeC1FZlJwmEJNGbQxUKRPjhH~~tzrVW-j~sSBggZK47a0CcYJ-Pr3upmZqMWlOAdmBp7zdLNLxdzfi1IOvzNOsgDjPmEN~pO8T-8fBbIWqB9IBqWramuJ0W-vn25~0lLnbJ~D57RgUeMoE95YMZoyB69xfliwnsqeaBPFpsqAPHs3uRubyzFCMynoFWywsYVfkU4zQ__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/20843447-5efb-4a13-b80f-05fa935fe7a1/20843447-5efb-4a13-b80f-05fa935fe7a1?Expires=1794338900&Signature=bZ7mEyS2ViJGnWB3oFTizNRcIgNYro4VTe9mnodyhs-ODltaOV9rj1tEN0CQH-qcRhY6s3Px80~GbG5qWZ6sCZJWhq8qBVzhBQ8TVr6INtnEdKNFRtJtiqfXeQlD-0X2s~PYnuffst0O~lJTVPs-R5O36Y2sqx5iAKQs5~X717ZHNHqPccx7fFur8Y6I7VSoUnmhF4omQiC7Zq1wg3P53KkHKUqHbrcqp4DUbPdf4O6WlmuPbBLCQKzlbc2YBorKKfr63ZMU8Fw~gvQDPGLaaBR1~naKxIq6hhLcj0vos3Gjmo8rxzv4TGYluNJWDP~xQdXktsveXn0MrtatDhPIhg__&Key-Pair-Id=KX9I6OACHF5M3"]
          hashes=["90b4ef0118ddafb165ecb844e935a950b32dea90ad4efa14e4db3873284ffc5e","a6cbdaad276005c16ac6fd6bc2e55dfb013d510ca38ac4ea5201c8aa8e4281b8","c96c383b2899dc24d6399f4e77aa1a6bc0f39dd43dc74a23cf40bb886cc7fe9c","1a0cbfee4895b735b760c51b49ac7ca53b17bbf00ebe10c401e145bad588de7d","cadad2abba0abdede5722b6666ced18506b0618bc65ae2e5edb12d4416a63430"]
          folder=Path("assets/approved_depot2027")
          folder.mkdir(parents=True,exist_ok=True)
          for i,(url,digest) in enumerate(zip(sources,hashes),1):
              request=urllib.request.Request(url,headers={"User-Agent":"Schmidt-Carousel-Transfer/1.0"})
              with urllib.request.urlopen(request,timeout=50) as response:
                  if response.status!=200:
                      raise RuntimeError("Slide %d download failure: HTTP %s"%(i,response.status))
                  content=response.read()
              checksum=hashlib.sha256(content).hexdigest()
              if checksum!=digest:
                  raise RuntimeError("Slide %d is not byte-identical to the user-approved original (expected %s got %s)"%(i,digest,checksum))
              image=Image.open(io.BytesIO(content))
              if image.size!=(1080,1350) or image.format!="JPEG":
                  raise RuntimeError("Slide %d unexpected image: %s %s"%(i,image.size,image.format))
              dest=folder/("%02d.jpg"%i)
              dest.write_bytes(content)
              print("Verified approved slide",i,len(content),"bytes")
          PY
      - name: Originalbilder dauerhaft im Repository sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved_depot2027/
          if ! git diff --cached --quiet; then
            git commit -m "Store five explicitly approved retirement-depot Instagram slides"
            for i in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Validierte Bilder abwarten und Beitrag an Buffer senden
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CONFIRMED_MEDIA_RELEASE: approved-depot-2027-5-slides
        run: |
          for attempt in 1 2 3 4 5; do
            if python3 scripts/publish_approved_depot_once.py; then
              echo "Buffer-Anfrage erfolgreich abgeschlossen."
              exit 0
            fi
            echo "Versuch ${attempt} fehlgeschlagen; Wiederholung nur bei unverändertem Inhalt."
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 6
          done
