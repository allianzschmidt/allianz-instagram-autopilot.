name: Terminierte Freigaben – Steinschlag + Wasserschaden
on:
  push:
    paths:
      - '.github/workflows/schedule-approved-week1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-12-13-nov-approved
  cancel-in-progress: false
jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Medienprüfung bereitstellen
        run: python3 -m pip install --user Pillow
      - name: Ausschließlich freigegebene Originalmotive prüfen und übertragen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request,io,hashlib
          from PIL import Image
          sources=["https://m.invideo.io/uploads/4a96aac5-ff78-4694-a281-1f4e8286f299/4a96aac5-ff78-4694-a281-1f4e8286f299?Expires=1794512420&Signature=yT6X2wOcND3Ro9Spu8rqYylWQ~7zNgUnaUYkfZ9kseeuBrmbrieItKlWLO1oJWJZAsNeTLd8xKl-qDqOxQLdkMW6tsTpejsZ4ibbnu~8e9IbrN2Arq7kBzC0fHBXUH6WVkBwnJAXGy87vTaoacVjMSksjSq3O-x23dv0Zd-Cou7ezxO2lHLYHp-tNrIIocEmgGB2cn~1~Gx7YO8eI6ULBct-pohww~cBBqTABVslcvLPJIENCd4L0T8MzlTjtz1AeDqQ6xOH7c0TQlSlDpzOcoloAG2GvmnojXAySDWbJI3~PxFM8B3E5-1XIhAtY9w7Qo~K-nW7rq9l4Ww9fX~rpw__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/6068da47-6c14-4d99-98d0-4c788e7901f5/6068da47-6c14-4d99-98d0-4c788e7901f5?Expires=1794512421&Signature=Tm~vgyhUj8m8pTTi9bEowqLbaCataLg93UKUjZQdWp5TlXKroF7CiqySpNTxsZmY3~g972rVyXTPVS0WrI2I5PR~wDVEknLu~LG7rGwfKlWudWSx9f8zNPH7PVWsHp85NcCLUhCXQ~ZmTPSOIm8NOQJSvxnD0uyisdRaPPtp4m2Ef2fgLdEsXvKVXGFv8SL4svnq8oGoPbrh9XmGGqcN1Q3zZa9fAnElYpwpljqyYeQLlVFvsJE5yIJjXnj4h7-GFmgjHqbh93DfRZq2kiHIe~X7m7OVWRWodm3RBxAN4~c3ItxKMImijqr6Cl5KYj3fZ3Q4OZJpPquskxhTwbfslg__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/cd6212b1-afe2-40d1-a687-19d125f62c23/cd6212b1-afe2-40d1-a687-19d125f62c23?Expires=1794512420&Signature=YQG6vnng3r2ufpVvq~ASVA9bdWoHeFDtSOsJSIA6ixIRjsbk0ql26ct8lFZ61SnTCFRwvAgJDHUbUFqk53ZHXvbO1nJ7JEWae6Sg2bHc9XT0N5YTjXX~se9E7WoYOnX0DHYiKHLzYONU2ZPehsYZ32nVrMBG3wcUplU8dytzcmdynbmjr~4hB955MuZlIBb4aXnGUGo9MWBwKAVwnInY-tM087IZW8kLF7UjP37yVxo-XoJ1OWmZ3~81RRxwUYSDTsLMbMg3xEg-JCh7ME8U0XP4xztty-4T2fYBUHvM-MwmUHlThNcw9x5Yp1eecEVFWtgOqQwixwQEV6Wi~OUAfA__&Key-Pair-Id=KX9I6OACHF5M3","https://m.invideo.io/uploads/cd6fde82-7ffa-46fe-afcc-ada431461667/cd6fde82-7ffa-46fe-afcc-ada431461667?Expires=1794512421&Signature=hizI~kV~PfvD1sNjvewwXdYAfOjkSRPq8ukuoAC6ovHGWw1XrVNIVU9knq5yrjldZOu4CvKOguG7f3JANBHUve4q9GGZIAaLtYMbVhhpYCjVwbUXq3dsGKvts4jhC48~NNkwMwvcMtzpCxX8wap-q0QQt1brbtejW~sjn9bSrJRuaSY64v19JIkQtLPMRgp991NMlBhBAHOiweTbiTBnBAE1zA0vZEyqEPBcdd-K0Wnow94XLwcxO2wvohrKsJLHzDv99Hx4-vr0TtdFptcu-8~5AePLZV1lk9PB5W6JJDvbc6nPSaESh8XBHnjOTbhfMawABHBj7~KBA