          checksums=["6821a1ba55cdc707aa7cbb1174fb6df6adc35c417d0ae5de566cdfd3cdb5eb0d","b1a16f4185207b7e8b628b58b52f177b8193024fe1c1a883a68d727a168f990b","c477f3ec388be6c8bd305ac496d1830cd60c96775c74e065a1826888c02b5d52","9f159f0fbddc21c9374bb6a87dc68dd07dce61c457ac8a5b96decf6152d4ffff","6712c695014d75737425dd8d5d508677e757d4a2860e932472a07aafff94d032"]
          names=["steinschlag.png","wasser_01.jpg","wasser_02.jpg","wasser_03.jpg","wasser_04.jpg"]
          dest=Path("assets/approved_week1")
          dest.mkdir(parents=True,exist_ok=True)
          for i,(url,checksum,name) in enumerate(zip(sources,checksums,names),1):
              with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Schmidt-Final-Media/1.0"}),timeout=70) as resp:
                  data=resp.read()
              if hashlib.sha256(data).hexdigest()!=checksum:
                  raise RuntimeError("Originaldatei stimmt nicht überein: "+name)
              im=Image.open(io.BytesIO(data))
              exp=(1122,1402) if i==1 else (1080,1350)
              if im.size!=exp or im.format!=("PNG" if i==1 else "JPEG"):
                  raise RuntimeError("Formatabweichung: "+name)
              (dest/name).write_bytes(data)
              print("EXAKTES ORIGINAL:",name,len(data))
          PY
      - name: Bilder für Buffer im Repository speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/approved_week1/
          if ! git diff --cached --quiet; then
            git commit -m "Store individually approved Steinschlag and Wasserschaden images"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Nur Steinschlag 12.11. und Wasserschaden 13.11. einplanen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CONFIRMED_MEDIA_RELEASE: approved-week1-12-13nov
        run: python3 scripts/schedule_approved_week1.py
