name: Freigabe – Schlüsselverlust-Karussell (4 Original-Slides)
on:
  push:
    paths:
      - '.github/workflows/publish-approved-key-once.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-keyloss-2026-11-11
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bildprüfung vorbereiten
        run: python3 -m pip install --user Pillow
      - name: Exakt vier freigegebene Schlüsselverlust-Slides sicher übertragen
