name: Kfz-Kampagne sofort auf normalen blauen Golf umstellen
on:
  push:
    paths:
      - '.github/workflows/replace-kfz-golf-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-premium-publishing
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bilddateiprüfung installieren
        run: python3 -m pip install --user Pillow
