          names=["feed.jpg","story_1.jpg","story_2.jpg","story_3.jpg"]
          digests=["771d568a519cd981af395215833266f07b3ba745af647329bd0c1a650e9bdc0c","58fe7f789e735bfe12a29b19e306f8a2ad8ef34673e9df7ab150c45e474d0cfc","0c7766097dd9f2368af9f0fd0c9a63549a00a7071f3a43d5c38273cd506405f4","401b083867b9d44afdd7d792b88c0207ebedd1e24b8c3b0cbc1c68e6eda20847"]
          sizes=[(1080,1350),(1080,1920),(1080,1920),(1080,1920)]
          folder=Path("assets/kfz_golf_2026_11_21")
          folder.mkdir(parents=True,exist_ok=True)
          for url,name,digest,size in zip(urls,names,digests,sizes):
              req=urllib.request.Request(url,headers={"User-Agent":"Schmidt-Kfz-Golf-Original/1.0"})
              with urllib.request.urlopen(req,timeout=65) as response:
                  raw=response.read()
              if sha256(raw).hexdigest()!=digest:raise RuntimeError("Source checksum mismatch: "+name)
              img=Image.open(io.BytesIO(raw))
              if img.format!="JPEG" or img.size!=size:raise RuntimeError("Wrong source size or format: "+name)
              (folder/name).write_bytes(raw)
              print("ORIGINAL GOLF MEDIUM VERIFIED:",name,len(raw),digest)
          
          PY
      - name: Medien dauerhaft für Buffer bereitstellen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kfz_golf_2026_11_21/
          if ! git diff --cached --quiet; then
            git commit -m "Host four checked ordinary VW Golf Kfz advertising visuals for Instagram"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Nur die vier heutigen noch nicht gesendeten Kampagnenslots ersetzen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GOLF_RELEASE: user-reference-blue-vw-golf-replacement-21nov2026
        run: python3 scripts/replace_kfz_car_with_blue_golf_20261121.py
