name: Read-only Instagram Buffer queue audit
on:
  push:
    paths:
      - '.github/workflows/check-approved-depot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check exact connected Instagram account and scheduled, sent posts (no writes)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from autopilot import get_channel, posts_from_buffer
          org, ch = get_channel()
          posts = posts_from_buffer(org['id'], ch['id'])
          print("ACCOUNT @allianzschmidtdoebeln")
          print("QUEUE AUDIT: read only")
          print("COUNT", len(posts))
          found = [p for p in posts if p.get('id') == '6af4c365cf36c484ae925f3c']
          if not found:
              raise SystemExit("SCHLUESSELSTATUS: noch nicht im Buffer-Ergebnis gefunden")
          print("SCHLUESSELKARUSSELL_ID", found[0].get('id'))
          print("SCHLUESSELKARUSSELL_STATUS", found[0].get('status'))
          print("SCHLUESSELKARUSSELL_DUE", found[0].get('dueAt'))
          for p in posts:
              status = p.get('status','')
              due = p.get('dueAt','')
              text = (p.get('text') or '').replace(chr(10),' ').replace(chr(13),' ')
              print("ITEM", p.get('id'), "STATUS", status, "DUE", due, "CAPTION", text[:125])
          PY
