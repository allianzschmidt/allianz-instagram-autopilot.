name: Live-Kontrolle aller geplanten Instagram-Beiträge
on:
  push:
    paths:
      - '.github/workflows/check-approved-depot.yml'
  schedule:
    - cron: '15 6,10,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: schmidt-instagram-readonly-audit
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konto und konkrete Termine in Buffer prüfen – nur lesend
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python3 - <<'PY'
          import sys
          from datetime import datetime,timezone,timedelta
          sys.path.insert(0,'scripts')
          from autopilot import get_channel,posts_from_buffer
          org,ch=get_channel()
          posts=posts_from_buffer(org['id'],ch['id'])
          by_id={p['id']:p for p in posts}
          now=datetime.now(timezone.utc)
          wanted=[
              ('2026-11-11T19:35:00Z','Schlüsselverlust Karussell','6af4c365cf36c484ae925f3c'),
              ('2026-11-12T11:30:00Z','Steinschlag','6af4c4bab523db05a3eb3fb1'),
              ('2026-11-13T17:30:00Z','Wasserschaden Karussell','6af4c4bbcf36c484ae92dbae'),
              ('2026-11-13T19:15:00Z','Wasserschaden Premium-Story','6af4ec0477f44b6536fd7573'),
              ('2026-11-14T07:30:00Z','Schluessel-Quiz Story','6af4ec058a1a2f52b508371a'),
              ('2026-11-19T11:30:00Z','Einkommensschutz Premium-Bild','6af4ec05bc9f3773a1a45de2'),
              ('2026-11-26T11:30:00Z','Starkregen Premium-Bild','6af4ec063d8c751bfdfae8b0'),
          ]
          print('EXAKTER INSTAGRAM-KANAL: @allianzschmidtdoebeln')
          print('UTC-JETZT:',now.isoformat())
          print('BUFFER-POSTS:',len(posts))
          errors=[]
          for date,title,post_id in wanted:
              target=datetime.fromisoformat(date.replace('Z','+00:00'))
              item=by_id.get(post_id)
              status=item.get('status') if item else 'MISSING'
              due=item.get('dueAt') if item else None
              print('KONTROLLE:',title,'ID:',post_id,'STATUS:',status,'FAELLIG:',due)
              if now>target+timedelta(minutes=45):
                  if status!='sent':errors.append(title+' nicht als sent bestätigt: '+str(status))
              elif now<target:
                  if status not in ('scheduled','buffer','sending','sent'):
                      errors.append(title+' nicht korrekt in Buffer: '+str(status))
          other=[(p.get('id'),p.get('dueAt'),p.get('status')) for p in posts if p.get('status') in ('buffer','scheduled','sending')]
          print('ZUSÄTZLICHE GEPLANTE:',other[:30])
          if errors:
              print('FEHLER / MANUELLE KONTROLLE NÖTIG:')
              for x in errors: print(' -',x)
              raise SystemExit(1)
          print('ALLE BEKANNTEN NÄCHSTEN TERMINE SIND NOCH IM ERWARTETEN STATUS.')
          PY

# Read-only on-demand status audit: 2026-11-13 20:43 CET
