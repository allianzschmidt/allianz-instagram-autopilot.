          d=Path("assets/campaign_kfz_2026_11_21")
          d.mkdir(parents=True,exist_ok=True)
          for i,(f,url,chk) in enumerate(zip(files,urls,checks),1):
              req=Request(url,headers={"User-Agent":"AgenturSchmidtKFZTransfer/1.0"})
              with urlopen(req,timeout=60) as response:
                  data=response.read()
              h=sha256(data).hexdigest()
              if h!=chk:raise RuntimeError("NICHT das freigegebene Original: "+f)
