      - name: Medien originalgetreu auf GitHub hosten, alte Designs weiterhin gesperrt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/campaign_kfz_2026_11_21/
          if ! git diff --cached --quiet; then
            git commit -m "Store eight checked high-quality Kfz Wechsel season Instagram visuals"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Drei Kfz-Stories und das fünfteilige Karussell heute in Buffer buchen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CAMPAIGN_RELEASE: explicit-user-request-kfz-21nov2026
        run: python3 scripts/publish_kfz_campaign_2026_11_21.py
