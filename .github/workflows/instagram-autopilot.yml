name: Legacy Instagram-Entwuerfe – nur manueller Verbindungstest
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Nur validate oder report; keine Veröffentlichung alter Entwürfe"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - report
permissions:
  contents: read
jobs:
  legacy_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sicherer Buffer-Test – veraltete Grafiken dürfen nie veröffentlicht werden
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISH_ENABLED: 'false'
          LEGAL_APPROVED: 'false'
          ACTION: ${{ inputs.action }}
        run: python3 scripts/autopilot.py "$ACTION"
