name: Allianz Instagram - sichere Buffer-Automation
on:
  push:
    paths:
      - '.github/workflows/instagram-autopilot.yml'
      - 'scripts/autopilot.py'
  schedule:
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: "validate, publish oder report"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish
          - report
permissions:
  contents: read
concurrency:
  group: allianz-buffer
  cancel-in-progress: false
jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buffer sicher pruefen oder planen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          LEGAL_APPROVED: ${{ vars.LEGAL_APPROVED }}
          ACTION: ${{ github.event_name == 'schedule' && 'publish' || github.event_name == 'push' && 'validate' || inputs.action }}
        run: python3 scripts/autopilot.py "$ACTION"
# Wiederholter schreibfreier Buffer-Verbindungstest am 2026-11-03
