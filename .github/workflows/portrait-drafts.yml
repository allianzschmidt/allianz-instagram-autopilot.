name: Allianz – fünf persönliche Fotoentwürfe
on:
  push:
    paths:
      - 'assets/portrait/paul_schmidt.jpg'
      - 'scripts/portrait_posts.py'
      - '.github/workflows/portrait-drafts.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: allianz-portrait-drafts
  cancel-in-progress: false
jobs:
  create-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow installieren
        run: python3 -m pip install --user Pillow
      - name: Einziges erlaubtes Personenfoto prüfen und Entwürfe erstellen
        run: python3 scripts/portrait_posts.py
      - name: Neue Entwürfe speichern, nicht veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portrait_cards/
          if ! git diff --cached --quiet; then
            git commit -m "Create five non-published Instagram drafts from Paul's photo"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Entwuerfe gespeichert."
                exit 0
              fi
              echo "Zwischenzeitliche GitHub-Aenderung; versuche erneut."
              sleep 3
            done
            echo "Push nach mehrfachen Konflikten fehlgeschlagen."
            exit 1
          fi
