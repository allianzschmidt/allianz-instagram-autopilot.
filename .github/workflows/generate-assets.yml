name: Allianz Instagram - Grafiken erzeugen
on:
  push:
    paths:
      - README.md
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1-5'
permissions:
  contents: write
concurrency:
  group: allianz-assets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Pillow installieren
        run: python3 -m pip install --user Pillow
      - name: Beitragsgrafiken erstellen
        run: python3 scripts/render.py
      - name: Grafiken versionieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Generate original Instagram cards"
            git push
          else
            echo "Grafiken unverändert."
          fi
