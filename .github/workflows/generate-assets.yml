name: Legacy Grafiken – nur manuell, NICHT veroeffentlichen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate_old:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alte Entwuerfe sind gesperrt
        run: |
          echo "Die 30 abgelehnten alten Designs bleiben mit approved:false gesperrt."
          python3 - <<'PY'
          import json
          posts=json.load(open('posts.json',encoding='utf8'))
          assert all(x.get('approved') is False for x in posts)
          print('Alle',len(posts),'alten Designs sind gesperrt.')
          PY
