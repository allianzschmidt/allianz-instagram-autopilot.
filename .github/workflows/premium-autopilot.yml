name: Premium Instagram – automatische Produktion und Buffer-Nachfüllung
on:
  push:
    paths:
      - '.github/workflows/premium-autopilot.yml'
      - 'scripts/premium_render.py'
      - 'scripts/premium_publish.py'
      - 'content/premium_2026_11_12.json'
  schedule:
    - cron: '05 4,8,12,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-premium-publishing
  cancel-in-progress: false
jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository mit Schreibberechtigung laden
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Designfreigabe vor ALLEM anderen prüfen – fail closed
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path('content/premium_2026_11_12.json').read_text(encoding='utf8'))
          approved=json.loads(Path('content/visual_approval_manifest.json').read_text(encoding='utf8'))
          ok=(plan.get('premium_visuals_explicitly_reapproved') is True
               and approved.get('account')=='allianzschmidtdoebeln'
               and bool(approved.get('media')))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as out:
              out.write('approved='+('true' if ok else 'false')+'\n')
          if ok:
              print('Designfreigaben vorhanden. Der zusätzliche SHA256-Mediencheck bleibt vor jedem Post aktiv.')
          else:
              print('SICHERHEITSSTOPP: Die vom Nutzer verworfenen Standardbilder werden WEDER neu erzeugt NOCH eingeplant.')
              print('Bereits freigegebene, separat gebuchte Qualitätsbeiträge laufen unabhängig weiter.')
          PY
      - name: Sichere Bildproduktion vorbereiten
        if: steps.gate.outputs.approved == 'true'
        run: python3 -m pip install --user Pillow
      - name: Alle thematisch freigegebenen Premium-Karussells und Stories erzeugen
        if: steps.gate.outputs.approved == 'true'
        run: python3 scripts/premium_render.py
      - name: Hochwertige Medien dauerhaft fuer Buffer bereitstellen
        if: steps.gate.outputs.approved == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/premium_autopilot_v1/
          if ! git diff --cached --quiet; then
            git commit -m "Generate logo-free premium carousel and story media for approved editorial plan"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Originalbilder in GitHub gespeichert"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Medien konnten nicht bereitgestellt werden; Veröffentlichung gestoppt"
                exit 1
              fi
              sleep 4
            done
          else
            echo "Die vorhandenen Premium-Medien sind unverändert"
          fi
      - name: Puenktliche Buffer-Buchung fuer kommende 43 Stunden sicherstellen
        if: steps.gate.outputs.approved == 'true'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PREMIUM_SERIES_RELEASE: approved-autopilot-premium-nov26-v1
        run: python3 scripts/premium_publish.py

# Wiederholungstests sind idempotent: identische Buffer-Termine werden erkannt und nicht doppelt angelegt.
