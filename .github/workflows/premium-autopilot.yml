name: Premium Instagram – geprüfter Medienvorrat und Buffer-Nachfüllung
on:
  push:
    paths:
      - '.github/workflows/premium-autopilot.yml'
      - 'scripts/master_publish.py'
      - 'content/master_ready_queue.json'
  schedule:
    - cron: '05 4,8,12,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schmidt-premium-publishing
  cancel-in-progress: false
jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Alte abgelehnte Serie bleibt gesperrt; Syntax und Bildprüfung
        run: |
          python3 -m pip install --user Pillow
          python3 -m py_compile scripts/master_publish.py scripts/audit_editorial_calendar.py
          python3 - <<'PY'
          import json
          assert json.load(open('content/premium_2026_11_12.json'))['premium_visuals_explicitly_reapproved'] is False
          PY
      - name: Einmaliger Transfer des gesichteten öffentlichen Kfz-Werbemotivs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request,io
          from PIL import Image
          p=Path("assets/master_reviewed/2026-11-28_kfz_story.png")
          digest="22bd12f6ae1b6f7b8d025c320b79e94fc60172bceb62c0339d92edc1f9cef87d"
          if not p.exists():
              url="https://m.invideo.io/uploads/72f36bf4-24a7-4c7d-bf25-e85f629ad282/72f36bf4-24a7-4c7d-bf25-e85f629ad282?Expires=1795950518&Signature=N82SFDUOZXViX-t7g1XoXjhWl~BZbw1hZLqyEeT6-LFabvIwrBvDJtfz7zoI7foP~hcUhcoCwZz8EqNDpvOVnsMygySkaSbRR47h0zJ0kN0V34bxflVEbLBMPq6rKv5YgL4JkCUJza5-fRJNiAhB5v~wKQv31aFjjMtLP4FOxM74D68JFGHYMXbxS0zr6S7lSNXWrqCYii~xMrhLgQ-CVHCO~6dvhVezfQBOsLMw7gdNMyW9t6hBlo1bDz7xdeQHYfGnMr46LMrk8A51tY1BjrwTlIIWWKzLw1fNFtrESF2Na2nEw~AV8lAhssIdjZAFdLEVRuEGz49R6cNouj9E0A__&Key-Pair-Id=KX9I6OACHF5M3"
              req=urllib.request.Request(url,headers={"User-Agent":"SchmidtMasterApprovedOriginal/1.0"})
              with urllib.request.urlopen(req,timeout=60) as r:raw=r.read()
              assert hashlib.sha256(raw).hexdigest()==digest, "Datei stimmt nicht mit gesichtetem Original überein"
              img=Image.open(io.BytesIO(raw))
              assert img.format=="PNG" and img.size==(941,1672)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(raw)
          assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          print("MASTER ORIGINAL Kfz Story exakt geprüft")
          
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/master_reviewed/2026-11-28_kfz_story.png
          if ! git diff --cached --quiet; then
            git commit -m "Stage exact visually reviewed November 28 Kfz Story"
            git push origin HEAD:main
          fi
      - name: Nur einzeln visuell geprüfte neue Originale in Buffer nachfüllen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/master_publish.py
      - name: Buffer-IDs und Buchungsbelege dauerhaft sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/master_ready_queue.json content/visual_approval_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified Buffer booking receipts and exact media review authority"
            git push origin HEAD:main
          fi
      - name: Sieben-Tage-Lücken ehrlich melden
        if: always()
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/audit_editorial_calendar.py
